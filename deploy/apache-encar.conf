# OPTIONAL -- only for serving the dashboard under a domain with HTTPS. Not
# needed when it is reached directly as http://<server-ip>:9191.
#
# Apache reverse proxy in front of the dashboard (gunicorn on port 9191, run
# by PM2 -- deploy/ecosystem.config.js; set its bind to 127.0.0.1:9191 then,
# so the port is not also open to the world).
#
#   sudo a2enmod proxy proxy_http headers
#   sudo cp deploy/apache-encar.conf /etc/apache2/sites-available/encar.conf
#   # set ServerName below to your domain
#   sudo a2ensite encar && sudo systemctl reload apache2
#   sudo certbot --apache -d encar.example.com      # HTTPS (Let's Encrypt)
#
# certbot adds the :443 VirtualHost and the redirect from :80 by itself.
# The dashboard's login is HTTP Basic, so serve it over HTTPS only.
# Apache passes the Authorization header through to the app unchanged.

<VirtualHost *:80>
    ServerName encar.example.com

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:9191/
    ProxyPassReverse / http://127.0.0.1:9191/
    # Check-plate with many plates and the export can take a while.
    ProxyTimeout 300

    ErrorLog  ${APACHE_LOG_DIR}/encar-error.log
    CustomLog ${APACHE_LOG_DIR}/encar-access.log combined
</VirtualHost>
